# Container-local only. The VPS's system Nginx/TLS/Medusa routes are unchanged.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    add_header X-Content-Type-Options nosniff always;

    location = /healthz { access_log off; default_type text/plain; return 200 'ok\n'; }
    location = /release.json { add_header Cache-Control 'no-store'; try_files $uri =404; }
    location /_next/static/ {
        add_header Cache-Control 'public, max-age=31536000, immutable';
        try_files $uri =404;
    }
    location ~ \.glb$ {
        types { model/gltf-binary glb; }
        add_header Cache-Control 'public, max-age=86400';
        try_files $uri =404;
    }
    location ~ \.wasm$ {
        types { application/wasm wasm; }
        add_header Cache-Control 'public, max-age=86400';
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control 'no-cache';
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
    location = /404.html { internal; }
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
}
